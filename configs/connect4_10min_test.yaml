# 10-min Connect4 CPU test: 1-min checkpoints so we can compare 1/5/8/10min bots.
budget_minutes: 10
checkpoint: {interval_minutes: 1}
selfplay: {games_per_iter: 64, simulations: 200, evaluator: rollout, threads: 2, temperature_moves: 10, dirichlet: 0.3, full_prob: 1.0, cheap_frac: 0.125}
network: {type: mlp, hidden: 128, layers: 2}
training: {lr: 0.001, weight_decay: 0.0001, batch_size: 256, steps_per_iter: 50, replay_capacity: 200000, mixed_precision: false}
race: {enabled: false, fraction_of_budget: 0.15, candidates: [{type: mlp, hidden: 128, layers: 2}]}
eval: {games: 20, sims: 200, promote_if_elo_gain_over: 0, min_confidence_games: 50}
clock: {minimum_think_ms: 0, maximum_think_ms: 30000, safety_margin_ms: 100, emergency_ms: 1000}
search: {min_simulations: 200, target_simulations: 2000, max_simulations: 20000}
logging: {dir: logs, format: jsonl}
